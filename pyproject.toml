[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "cap-sim-experience-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]
[project.scripts]
experience-agent = "experience_agent.cli:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
